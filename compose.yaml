# Execução endurecida do console. Uso:
#   mkdir -p secrets && openssl rand -hex 24 > secrets/admin_token.txt   # token (≥ 16 caracteres)
#   docker compose up -d --build
#   abrir http://127.0.0.1:3001 e informar o token quando solicitado
services:
  drtool:
    build:
      context: .
      args:
        WITH_TOOLS: "true"          # "false" = imagem enxuta sem aws CLI/kubectl
    image: infrastructure-drtool:local
    ports:
      # Padrão: só localhost. Para a rede interna defina o IP interno do host: BIND_ADDR=10.0.0.5 docker-compose up -d
      # (não use 0.0.0.0: o console está sem autenticação)
      - "${BIND_ADDR:-127.0.0.1}:3001:3001"
    environment:
      ALLOW_NO_AUTH: "true"         # SEM autenticação. Para reativar: remova esta linha e use ADMIN_TOKEN_FILE + secret abaixo
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"       # hostname/IP usado no acesso interno, ex.: 10.0.0.5,drtool.interno
      # AWS_REGION: us-east-1
      # AWS_PROFILE: meu-perfil
    volumes:
      - drtool-data:/data
      # credenciais AWS (somente leitura). Para SSO use `aws sso login` no host e monte também o cache,
      # ou prefira variáveis AWS_* / role da instância:
      # - ${HOME}/.aws:/home/app/.aws:ro
      # kubeconfig para os providers k8s (somente leitura):
      # - ${HOME}/.kube/config:/home/app/.kube/config:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

volumes:
  drtool-data:
