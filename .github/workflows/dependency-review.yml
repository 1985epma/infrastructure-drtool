name: Revisão de dependências

# Bloqueia PRs que introduzem dependências vulneráveis ou licenças incompatíveis (repositório público).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Revisão de dependências
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
