name: Publicar pacote npm (GitHub Packages)

# Publica @1985epma/infrastructure-drtool em https://npm.pkg.github.com
# ao publicar um Release, ou manualmente (Actions → Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == '1985epma/infrastructure-drtool'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@1985epma'

      - name: Testes
        run: npm test

      - name: Conteúdo do pacote
        run: npm pack --dry-run

      - name: Publicar
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
