name: Publicar pacote npm (GitHub Packages)

# Publica @1985epma/infrastructure-drtool em https://npm.pkg.github.com
# ao publicar um Release, ou manualmente (Actions → Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@1985epma'

      - name: Testes
        run: npm test

      - name: Conteúdo do pacote
        run: npm pack --dry-run

      - name: Publicar
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
